<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Chess</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1d1f24; font-family: system-ui, sans-serif; color: #eee; }
  #hud { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #status { background: #000a; padding: 8px 12px; border-radius: 8px; }
  button { background: #333c; color: #eee; border: 1px solid #666; border-radius: 8px; padding: 8px 12px; cursor: pointer; font: inherit; }
  button:hover { background: #444; }
  select { background: #333c; color: #eee; border: 1px solid #666; border-radius: 8px; padding: 8px; font: inherit; }
  select:disabled { opacity: 0.4; }
  label { background: #000a; padding: 8px 12px; border-radius: 8px; cursor: pointer; }
  #captured { position: fixed; bottom: 12px; left: 12px; right: 12px; display: flex; flex-direction: column; gap: 4px; pointer-events: none; }
  #captured div { background: #000a; padding: 6px 12px; border-radius: 8px; align-self: flex-start; font-size: 20px; }
  #captured div:empty { display: none; }
  dialog { background: #2a2d33; color: #eee; border: 1px solid #666; border-radius: 12px; text-align: center; }
  dialog::backdrop { background: #0008; }
  dialog button { font-size: 36px; width: 64px; height: 64px; margin: 4px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "chess.js": "https://cdn.jsdelivr.net/npm/chess.js@1.4.0/+esm"
} }
</script>
</head>
<body>
<div id="hud">
  <span id="status"></span>
  <button id="undo">Undo</button>
  <button id="reset">New game</button>
  <button id="flip">Flip board</button>
  <label><input type="checkbox" id="autoflip"> Auto-flip</label>
  <select id="mode" aria-label="Opponent">
    <option value="2p">2 players</option>
    <option value="easy">vs CPU: Easy</option>
    <option value="medium">vs CPU: Medium</option>
    <option value="hard">vs CPU: Hard</option>
    <option value="max">vs CPU: Max</option>
  </select>
  <select id="side" aria-label="Your colour">
    <option value="w">Play White</option>
    <option value="b">Play Black</option>
  </select>
  <select id="theme" aria-label="Board theme">
    <option value="wood">Wood</option>
    <option value="marble">Marble</option>
    <option value="green">Tournament</option>
    <option value="night">Night</option>
  </select>
  <label><input type="checkbox" id="sound" checked> Sound</label>
  <button id="save">Save PGN</button>
  <button id="load">Load PGN</button>
  <input type="file" id="pgnFile" accept=".pgn,text/plain" hidden>
</div>
<div id="captured"><div id="capW"></div><div id="capB"></div></div>
<dialog id="promo">
  <p>Promote to</p>
  <form method="dialog">
    <button value="q" title="Queen">♕&#xFE0E;</button><button value="r" title="Rook">♖&#xFE0E;</button><button value="b" title="Bishop">♗&#xFE0E;</button><button value="n" title="Knight">♘&#xFE0E;</button>
  </form>
</dialog>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { Chess } from 'chess.js';

const game = new Chess();

// --- scene ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1d1f24);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 10, 10);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.85;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
Object.assign(controls, { enableDamping: true, enablePan: false, minDistance: 6, maxDistance: 25, maxPolarAngle: Math.PI / 2.2 });

scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture; // soft reflections on the lacquer
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 0.4));
const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.position.set(5, 12, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6 });
scene.add(sun);

// --- board ---
const FILES = 'abcdefgh';
const toPos = sq => [FILES.indexOf(sq[0]) - 3.5, 3.5 - (sq[1] - 1)]; // [x, z], white sits at +z

const frame = new THREE.Mesh(new THREE.BoxGeometry(9, 0.3, 9), new THREE.MeshStandardMaterial({ color: 0x3b2516 }));
frame.position.y = -0.16;
frame.receiveShadow = true;
scene.add(frame);

const squares = {};
for (let f = 0; f < 8; f++) for (let r = 0; r < 8; r++) {
  const sq = FILES[f] + (r + 1);
  const m = new THREE.Mesh(new THREE.BoxGeometry(1, 0.2, 1), new THREE.MeshStandardMaterial());
  const [x, z] = toPos(sq);
  m.position.set(x, -0.1, z);
  m.receiveShadow = true;
  m.userData = { sq, dark: (f + r) % 2 === 0 }; // a1 is dark; base colour comes from the theme
  scene.add(m);
  squares[sq] = m;
}

// --- settings that survive a reload (storage can be blocked, so never let it throw) ---
const store = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
};

// --- themes ---
const THEMES = {
  wood:   { light: 0xe8d6b0, dark: 0x8b5a3c, frame: 0x3b2516, bg: 0x1d1f24 },
  marble: { light: 0xeeeeee, dark: 0x8a8f98, frame: 0x44474d, bg: 0x202328 },
  green:  { light: 0xeeeed2, dark: 0x769656, frame: 0x2f3b22, bg: 0x1b1f1a },
  night:  { light: 0x9fb3c8, dark: 0x34495e, frame: 0x1a2533, bg: 0x0e1218 },
};
const themeEl = document.getElementById('theme');
function applyTheme(name) {
  const t = THEMES[name] ?? THEMES.wood;
  for (const m of Object.values(squares)) m.userData.base = m.userData.dark ? t.dark : t.light;
  frame.material.color.setHex(t.frame);
  scene.background.setHex(t.bg);
}
themeEl.value = THEMES[store.get('theme')] ? store.get('theme') : 'wood';
applyTheme(themeEl.value);

// --- sounds (synthesised with Web Audio, no files) ---
const soundEl = document.getElementById('sound');
soundEl.checked = store.get('sound') !== 'off';
let actx;
function tone(freq, dur, type, vol, delay = 0) {
  actx ??= new AudioContext();
  const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  o.frequency.exponentialRampToValueAtTime(freq * 0.5, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(actx.destination);
  o.start(t);
  o.stop(t + dur);
}
function playSound(m) {
  if (!soundEl.checked) return;
  if (game.isGameOver()) [523, 659, 784].forEach((f, i) => tone(f, 0.5, 'triangle', 0.2, i * 0.12));
  else if (game.inCheck()) { tone(880, 0.15, 'square', 0.1); tone(660, 0.2, 'square', 0.1, 0.12); }
  else if (m.captured) tone(180, 0.18, 'triangle', 0.5);
  else tone(320, 0.08, 'triangle', 0.35);
}

// --- pieces: Staunton-style silhouettes ---
const mats = {
  w: new THREE.MeshPhysicalMaterial({ color: 0xe6d6b8, roughness: 0.35, clearcoat: 1, clearcoatRoughness: 0.15, envMapIntensity: 0.5 }), // lacquered boxwood
  b: new THREE.MeshPhysicalMaterial({ color: 0x1c1712, roughness: 0.3, clearcoat: 1, clearcoatRoughness: 0.15, envMapIntensity: 0.8 }), // ebony
};

// lathe profiles as [radius, height], bottom to top; one square = 1 unit
const BASE = [[0, 0], [0.35, 0], [0.36, 0.03], [0.35, 0.06], [0.3, 0.08], [0.3, 0.1], [0.26, 0.12]];
const ball = (y, r) => Array.from({ length: 10 }, (_, i) => {
  const a = -Math.PI / 4 + i * (3 * Math.PI / 4) / 9; // -45deg up to the pole
  return [r * Math.cos(a), y + r * Math.sin(a)];
});
const PROFILES = {
  p: [...BASE, [0.18, 0.17], [0.12, 0.26], [0.095, 0.33], [0.15, 0.35], [0.155, 0.37], [0.09, 0.385], ...ball(0.47, 0.105)],
  r: [...BASE, [0.22, 0.18], [0.19, 0.46], [0.235, 0.49], [0.235, 0.51], [0.2, 0.53], [0.24, 0.56], [0.25, 0.64], [0.17, 0.64], [0.17, 0.6], [0, 0.6]],
  n: [...BASE, [0.23, 0.16], [0.23, 0.19], [0, 0.19]],
  b: [...BASE, [0.17, 0.18], [0.115, 0.3], [0.085, 0.46], [0.08, 0.52], [0.16, 0.54], [0.165, 0.56], [0.1, 0.58], [0.12, 0.61],
      [0.145, 0.66], [0.145, 0.72], [0.12, 0.78], [0.08, 0.83], [0.04, 0.86], ...ball(0.9, 0.045)],
  q: [...BASE, [0.19, 0.2], [0.13, 0.35], [0.095, 0.55], [0.09, 0.63], [0.17, 0.65], [0.175, 0.67], [0.11, 0.69], [0.12, 0.72],
      [0.15, 0.8], [0.19, 0.89], [0.16, 0.9], [0.13, 0.92], [0.08, 0.95], ...ball(1.0, 0.055)],
  k: [...BASE, [0.19, 0.2], [0.13, 0.36], [0.1, 0.58], [0.095, 0.66], [0.175, 0.68], [0.18, 0.7], [0.115, 0.72], [0.125, 0.75],
      [0.16, 0.84], [0.185, 0.92], [0.15, 0.93], [0.13, 0.96], [0.08, 0.99], [0, 1.0]],
};

// knight head: side silhouette (forward = +x, up = +y), extruded and bevelled
function knightHead() {
  const s = new THREE.Shape();
  s.moveTo(-0.2, 0);
  s.lineTo(0.2, 0);
  s.quadraticCurveTo(0.2, 0.12, 0.09, 0.24);   // chest up to throat
  s.quadraticCurveTo(0.15, 0.3, 0.26, 0.31);   // under the jaw
  s.quadraticCurveTo(0.33, 0.33, 0.31, 0.4);   // muzzle
  s.quadraticCurveTo(0.24, 0.5, 0.12, 0.58);   // nose bridge to forehead
  s.lineTo(0.08, 0.73);                        // ear
  s.lineTo(0.0, 0.62);
  s.quadraticCurveTo(-0.13, 0.6, -0.2, 0.42);  // back of the head
  s.quadraticCurveTo(-0.3, 0.2, -0.2, 0);      // mane down the neck
  const geo = new THREE.ExtrudeGeometry(s, { depth: 0.12, curveSegments: 32, bevelThickness: 0.05, bevelSize: 0.035, bevelSegments: 6 });
  geo.translate(0, 0, -0.06);
  return geo;
}

// rook crown: 6 ring segments with gaps, extruded upward
function battlements() {
  const shapes = Array.from({ length: 6 }, (_, i) => {
    const a0 = i * Math.PI / 3, a1 = a0 + Math.PI / 5, sh = new THREE.Shape();
    sh.absarc(0, 0, 0.25, a0, a1, false);
    sh.absarc(0, 0, 0.17, a1, a0, true);
    return sh;
  });
  const geo = new THREE.ExtrudeGeometry(shapes, { depth: 0.09, curveSegments: 8, bevelThickness: 0.01, bevelSize: 0.008, bevelSegments: 2 });
  geo.rotateX(-Math.PI / 2);
  return geo;
}

function buildPiece(type, color) {
  const g = new THREE.Group();
  const add = (geo, x = 0, y = 0, z = 0) => {
    const m = new THREE.Mesh(geo, mats[color]);
    m.position.set(x, y, z);
    m.castShadow = m.receiveShadow = true;
    g.add(m);
    return m;
  };
  add(new THREE.LatheGeometry(PROFILES[type].map(([r, y]) => new THREE.Vector2(r, y)), 48));
  const ring = (n, r, y, geo) => {
    for (let i = 0; i < n; i++) {
      const a = i * 2 * Math.PI / n;
      add(geo, Math.cos(a) * r, y, Math.sin(a) * r).rotation.y = -a;
    }
  };
  if (type === 'r') add(battlements(), 0, 0.64);
  if (type === 'q') ring(8, 0.18, 0.905, new THREE.SphereGeometry(0.028, 12, 8)); // crown points
  if (type === 'k') { add(new THREE.BoxGeometry(0.05, 0.2, 0.05), 0, 1.09); add(new THREE.BoxGeometry(0.15, 0.05, 0.05), 0, 1.12); }
  if (type === 'n') add(knightHead(), 0, 0.17).rotation.y = Math.PI / 2; // +x turned to face -z (the opponent, for white)
  if (color === 'b') g.rotation.y = Math.PI;
  return g;
}

const templates = {};
const makePiece = (type, color) => (templates[type + color] ??= buildPiece(type, color)).clone(); // clones share geometry

const pieceGroup = new THREE.Group();
scene.add(pieceGroup);

// ponytail: animates the old meshes, then rebuilds every piece; fine at 32 pieces
function syncPieces() {
  pieceGroup.clear();
  for (const p of game.board().flat()) if (p) {
    const g = makePiece(p.type, p.color);
    const [x, z] = toPos(p.square);
    g.position.set(x, 0, z);
    g.userData.sq = p.square;
    pieceGroup.add(g);
  }
}

// --- animation ---
const ease = t => t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2;
const tween = (ms, step) => new Promise(done => {
  const t0 = performance.now();
  const frame = now => {
    const t = Math.min(1, (now - t0) / ms);
    step(ease(t), t);
    t < 1 ? requestAnimationFrame(frame) : done();
  };
  requestAnimationFrame(frame);
});
const pieceAt = sq => pieceGroup.children.find(g => g.userData.sq === sq);

function animateMove(m) {
  const rank = m.from[1], slides = [[m.from, m.to]];
  if (m.flags.includes('k')) slides.push(['h' + rank, 'f' + rank]); // castling rook
  if (m.flags.includes('q')) slides.push(['a' + rank, 'd' + rank]);
  const capSq = m.flags.includes('e') ? m.to[0] + m.from[1] : m.captured && m.to;
  const victim = capSq && pieceAt(capSq);
  const runs = slides.map(([a, b]) => ({ g: pieceAt(a), a: toPos(a), b: toPos(b) }));
  return tween(400, (e, t) => {
    for (const { g, a, b } of runs) g.position.set(a[0] + (b[0] - a[0]) * e, Math.sin(t * Math.PI) * 0.6, a[1] + (b[1] - a[1]) * e);
    victim?.scale.setScalar(Math.max(0.001, 1 - t));
  });
}

// --- camera flip ---
function flipCamera() {
  const p = camera.position, r = Math.hypot(p.x, p.z), y = p.y, start = Math.atan2(p.x, p.z);
  return tween(700, e => {
    const a = start + Math.PI * e;
    camera.position.set(Math.sin(a) * r, y, Math.cos(a) * r);
    camera.lookAt(0, 0, 0);
  });
}
const autoflip = document.getElementById('autoflip');
function faceSideToMove() {
  // vs CPU: always face the human; 2 players: face whoever moves if auto-flip is on
  const facing = cpuColor() ? (cpuColor() === 'w' ? 'b' : 'w') : autoflip.checked && game.turn();
  if (!facing) return;
  const wantZ = facing === 'w' ? 1 : -1; // white sits at +z
  if (Math.sign(camera.position.z) !== wantZ) return flipCamera();
}

// --- computer opponent (Stockfish 10, runs in a Web Worker) ---
const SF_URL = 'https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js';
const engine = new Worker(URL.createObjectURL(new Blob([`importScripts('${SF_URL}')`], { type: 'application/javascript' })));
engine.postMessage('uci');
const LEVELS = { easy: [0, 100], medium: [8, 300], hard: [15, 800], max: [20, 2000] }; // [Skill Level 0-20, think time ms]
const modeEl = document.getElementById('mode'), sideEl = document.getElementById('side');
const cpuColor = () => modeEl.value === '2p' ? null : sideEl.value === 'w' ? 'b' : 'w';

function bestMove(fen, skill, ms) {
  return new Promise(res => {
    engine.onmessage = e => {
      const m = /^bestmove (\S+)/.exec(e.data);
      if (m) res(m[1]);
    };
    engine.postMessage(`setoption name Skill Level value ${skill}`);
    engine.postMessage(`position fen ${fen}`);
    engine.postMessage(`go movetime ${ms}`);
  });
}

async function maybeCpu() {
  if (game.turn() !== cpuColor() || game.isGameOver()) return;
  busy = true;
  statusEl.textContent = 'Computer is thinking…';
  const [skill, ms] = LEVELS[modeEl.value];
  const uci = await bestMove(game.fen(), skill, ms); // e.g. "e7e8q"
  busy = false;
  await playMove({ from: uci.slice(0, 2), to: uci.slice(2, 4), promotion: uci[4] });
}

// --- captured pieces ---
const VAL = { p: 1, n: 3, b: 3, r: 5, q: 9 };
const GLYPH = { w: { p: '♙', n: '♘', b: '♗', r: '♖', q: '♕' }, b: { p: '♟', n: '♞', b: '♝', r: '♜', q: '♛' } };
const capEl = { w: document.getElementById('capW'), b: document.getElementById('capB') };
function showCaptured() {
  const caps = { w: [], b: [] }; // pieces taken BY each colour
  for (const m of game.history({ verbose: true })) if (m.captured) caps[m.color].push(m.captured);
  const score = c => caps[c].reduce((s, p) => s + VAL[p], 0);
  for (const c of ['w', 'b']) {
    const other = c === 'w' ? 'b' : 'w', diff = score(c) - score(other);
    capEl[c].textContent = caps[c].length
      ? `${c === 'w' ? 'White' : 'Black'}: ${caps[c].sort((x, y) => VAL[y] - VAL[x]).map(p => GLYPH[other][p] + '︎').join('')}${diff > 0 ? ' +' + diff : ''}`
      : '';
  }
}

// --- promotion picker ---
const promo = document.getElementById('promo');
function pickPromotion() {
  promo.returnValue = '';
  promo.showModal();
  return new Promise(res => promo.addEventListener('close', () => res(promo.returnValue), { once: true })); // '' = cancelled (Esc)
}

// --- selection + highlights ---
let selected = null, targets = [], busy = false;
const statusEl = document.getElementById('status');

function paint() {
  for (const m of Object.values(squares)) m.material.color.setHex(m.userData.base);
  const last = game.history({ verbose: true }).at(-1);
  if (last) for (const s of [last.from, last.to]) squares[s].material.color.setHex(0xc9b44a);
  if (game.inCheck()) {
    const king = game.board().flat().find(p => p && p.type === 'k' && p.color === game.turn());
    squares[king.square].material.color.setHex(0xd04040);
  }
  if (selected) squares[selected].material.color.setHex(0x5fa8d3);
  for (const m of targets) squares[m.to].material.color.setHex(m.captured ? 0xd9734a : 0x7cc47f);
}

function update() {
  paint();
  showCaptured();
  store.set('pgn', game.pgn()); // autosave, restored on reload
  const side = game.turn() === 'w' ? 'White' : 'Black';
  statusEl.textContent =
    game.isCheckmate() ? `Checkmate: ${side === 'White' ? 'Black' : 'White'} wins` :
    game.isDraw() ? 'Draw' :
    `${side} to move${game.inCheck() ? ' (check!)' : ''}`;
}

async function playMove(mv) {
  busy = true;
  const m = game.move(mv);
  update();
  await animateMove(m);
  playSound(m);
  syncPieces();
  await faceSideToMove();
  busy = false;
  maybeCpu();
}

async function onSquare(sq) {
  if (busy || game.isGameOver() || game.turn() === cpuColor()) return;
  const move = targets.find(m => m.to === sq), prev = selected;
  selected = null; targets = [];
  if (move) {
    busy = true;
    const promotion = move.promotion && await pickPromotion();
    busy = false;
    if (move.promotion && !promotion) return update();
    return playMove({ from: move.from, to: sq, promotion });
  }
  const p = game.get(sq);
  if (p && p.color === game.turn() && sq !== prev) {
    selected = sq;
    targets = game.moves({ square: sq, verbose: true });
  }
  update();
}

// click (but not drag-to-orbit) picks a square
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let down = null;
renderer.domElement.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
  ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects([pieceGroup, ...Object.values(squares)], true)[0];
  let o = hit?.object;
  while (o && !o.userData.sq) o = o.parent;
  if (o) onSquare(o.userData.sq);
});

async function restart(fn) {
  if (busy) return;
  busy = true;
  await fn(); selected = null; targets = []; syncPieces(); update();
  sideEl.disabled = !cpuColor();
  await faceSideToMove();
  busy = false;
  maybeCpu();
}
document.getElementById('undo').onclick = () => restart(() => {
  game.undo();
  if (game.turn() === cpuColor()) game.undo(); // vs CPU: take back the CPU reply too
});
document.getElementById('reset').onclick = () => restart(() => game.reset());
document.getElementById('flip').onclick = () => restart(flipCamera);
autoflip.onchange = modeEl.onchange = sideEl.onchange = () => restart(() => {});
themeEl.onchange = () => { store.set('theme', themeEl.value); applyTheme(themeEl.value); paint(); };
soundEl.onchange = () => store.set('sound', soundEl.checked ? 'on' : 'off');

// --- PGN save / load ---
document.getElementById('save').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([game.pgn()], { type: 'application/x-chess-pgn' }));
  a.download = `chess-${new Date().toISOString().slice(0, 10)}.pgn`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
const pgnFile = document.getElementById('pgnFile');
document.getElementById('load').onclick = () => pgnFile.click();
pgnFile.onchange = async () => {
  const text = await pgnFile.files[0]?.text();
  pgnFile.value = ''; // lets the same file be picked again
  if (!text) return;
  try { new Chess().loadPgn(text); } catch { return alert('Could not read that PGN file.'); } // validate on a scratch board first
  restart(() => game.loadPgn(text));
};

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

restart(() => { try { game.loadPgn(store.get('pgn') ?? ''); } catch {} }); // resume the autosaved game
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
Object.assign(window, { game, restart }); // console debugging: restart(() => game.load(fen))
</script>
</body>
</html>
